target: target_minutes
baseline_feature: player_avg_mins_l6

test_seasons:
  - "2024-25"
  - "2025-26"

use_position: true
use_context: false
use_chance_of_playing: true

minutes_feature_prefixes:
  - player_avg_mins_l
  - player_avg_meaningful_l
  - player_avg_meaningful_mins_l

context_features:
  - kickoff_day_type
  - kickoff_time_type

chance_of_playing_feature: chance_of_playing_next_round

lightgbm:
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 31
  max_depth: -1
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  verbosity: -1

hist_gradient_boosting:
  learning_rate: 0.05
  max_iter: 300
  max_leaf_nodes: 31
  l2_regularization: 1.0
  random_state: 42
